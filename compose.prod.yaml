services:
  app:
    build: .
    image: monapp:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  queue:
    image: monapp:latest
    restart: unless-stopped
    env_file: .env
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3"]
    volumes:
      - app-storage:/var/www/html/storage
    depends_on: [app]
    networks: [internal]

  scheduler:
    image: monapp:latest
    restart: unless-stopped
    env_file: .env
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    volumes:
      - app-storage:/var/www/html/storage
    depends_on: [app]
    networks: [internal]

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      retries: 5
      timeout: 5s
    networks: [internal]

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      retries: 3
      timeout: 5s
    networks: [internal]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]
    networks: [internal]

networks:
  internal:

volumes:
  app-storage:
  mariadb-data:
  redis-data:
  caddy-data: